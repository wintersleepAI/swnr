  - name: Cyborg Special Abilities (2 picks)
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>Cyborgs all have some sort of chrome, though many systems may be too damaged or too
        trivial to have any real game effect. The systems below, however, are more meaningful.
        Others can be lifted from <em>Cities Without Number</em> at the GM's discretion.</p>

        <p>Systems marked with asterisks count as that many special ability picks; thus, Enhanced
        Reflexes Omega counts as three picks.</p>

        <ul>

        <li><strong>Backup Organs:</strong> The cyborg ignores the first Traumatic Hit they suffer
        in a fight, reducing it to its normal damage total.</li>

        <li><strong>Body Arsenal:</strong> Their unarmed attacks do 2d6+2 damage with a Shock of
        4/15 and a Trauma Die of 1d10/x3.</li>

        <li><strong>Dermal Plating:</strong> Their base AC is 18, or +2 if higher, and their base
        Trauma Target is 7.</li>

        <li><strong>Enhanced Reflexes Alpha:</strong> Once per scene, on their turn, they get a
        bonus Main Action.</li>

        <li><strong>Enhanced Reflexes Beta**:</strong> Twice per scene, on their turn, they get a
        bonus Main and Move Action.</li>

        <li><strong>Enhanced Reflexes Omega***:</strong> As Beta, but they can trigger the extra
        action as an Instant action.</li>

        <li><strong>Ghost Camo:</strong> When active, they cannot be detected by human senses from
        more than 10 meters distance. When closer, they get a +2 bonus to any stealth skill
        checks.</li>

        <li><strong>Mounted Weapon:</strong> They have a built-in firearm that grants them +2 to hit
        and a +1 to their Trauma Die rolls that doesn't stack with other bonuses. This gun has
        effectively unlimited ammo.</li>

        <li><strong>Movement Boost Alpha:</strong> Their base Move rate is increased by 10
        meters.</li>

        <li><strong>Movement Boost Beta**:</strong> As Alpha, but once per scene they can take a
        Move action as an Instant action.</li>

        <li><strong>Muscle Augmentation:</strong> They gain +4 damage to melee and melee Shock, and
        can break doors and do similar feats of strength as On Turn actions.</li>

        <li><strong>Nemesis Targeter**:</strong> Once per fight, as an Instant action, the cyborg
        can turn a weapon miss into a hit.</li>

        <li><strong>Omnispectral Sight:</strong> They can see even in perfect darkness and detect
        invisible creatures unless the effect is psychic in nature.</li>

        <li><strong>Pheromone Booster:</strong> They get a +1 to their Skill Bonus for social
        interactions. Once per scene, they can make a semi-plausible request of someone, who must
        succeed on a Mental save to resist obeying for as long as the rest of the scene.</li>

        <li><strong>Polyskin:</strong> As an On Turn action, they can mimic any human they've seen
        before, including altering the appearance of their armor or clothing. This mimicry lasts
        while they are alive or until they turn it off.</li>

        <li><strong>Sealed Systems:</strong> The cyborg ignores environmental hazards as if they
        were wearing a space suit.</li>

        <li><strong>Self-Repair Unit:</strong> Above zero hit points, the cyborg heals 5 points of
        damage each round. If Mortally Wounded, it stabilizes automatically.</li>

        <li><strong>Terminator Tendrils:</strong> They can extend manipulatory tendrils up to 5
        meters to handle or manipulate things. Any downed enemies within that range at the end of
        the cyborg's turn are coup-de-graced by them, killing them instantly.</li>

        <li><strong>Titan Gun Mount***:</strong> They have a built-in Heavy weapon normally
        requiring a vehicle to mount it. This gun has effectively unlimited ammo.</li>

        <li><strong>Wallcrawler:</strong> They can traverse walls and ceilings as if they were flat
        ground.</li>

        <li><strong>Weak Point Targeting**:</strong> Any Shock they inflict treats the subject as
        having AC 10, and their Trauma Die rolls gain a +2 bonus.</li>

        </ul>
