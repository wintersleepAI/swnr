  biography: >-
    <p><strong>HD</strong> 5 &bull; <strong>AC</strong> 13 &bull; <strong>Atk</strong> +7 &bull;
    <strong>Dmg</strong> wpn+2 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn+2
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 9 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 13+</p>

    <p>Found in nomadic herds under the leadership of a bullman chief, these mutants usually appear
    as bipedal, cattle-headed humanoids at least a head taller than a corresponding baseline. Some
    with a more feral admixture have hoofed feet and a short, dense fur, while others appear almost
    baseline save for the horns that both bullmen and cowgirls sport.</p>

    <p>Bullfolk are seldom naturally aggressive or hostile towards baseline humans, most herds
    having no interest in anything but good grazing and trampling predators. Social hierarchy within
    the herd is strict and based on personal strength and achievement. Stray bulls or cows who don't
    fit in with their brethren sometimes seek employment in baseline settlements until they can
    perform sufficiently impressive deeds or meet a more congenial herd. Others join fellow outcasts
    to become banditos, earning glory through bloodshed.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +2 is already set and applies to every weapon damage roll.
    Its Shock is that of its weapon, +2.</p>
