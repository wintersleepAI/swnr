  - name: Self-Powered Chassis
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>Robots are self-powered and do not normally run out of ammunition for any weapons they
        have built in.</p><p>Most late-Mandate robots can self-repair up to their hit dice in lost
        hit points every 24 hours, requiring an eight-hour shutdown period in which to conduct the
        repairs. One unit of TL4 scrap can instead repair half the robot's maximum hit points in
        damage with half an hour of work. Robots reduced to zero hit points are completely wrecked
        and can only be scrapped.</p>
