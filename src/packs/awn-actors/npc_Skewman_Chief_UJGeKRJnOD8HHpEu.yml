  biography: >-
    <p><strong>HD</strong> 4 &bull; <strong>AC</strong> 16 &bull; <strong>Atk</strong> +6x2 &bull;
    <strong>Dmg</strong> wpn+2 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 9 &bull; <strong>Skill</strong> +3
    &bull; <strong>Save</strong> 13+</p>

    <p>A heritable deficiency in ligament formation produces the skewmen, an unhappy breed of
    deformed mutants. Their joints are remarkably flexible but unable to support them upright. They
    are forced to crawl with an unsettling quickness and to use blunt weapons that are as much
    crutch as club.</p><p>Most skewman tribes nurse a bitter hatred of the "upright", blaming them
    for causing the disaster that cursed their ancestors. Prisoners they take are subject to
    terrible operations that will transform them into a skewman as well if not rescued within a
    month.</p>

    <p>Skewmen are especially voracious gatherers of ancient technology, even items they cannot use.
    Their chieftains are always adorned with several such devices.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +2 is already set and applies to every weapon damage
    roll.</p>
