  - name: Expert System
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>The bot is competent within its function but lacks any true general intelligence or
        self-awareness. Whenever it is called on to function outside its role, make a skill check
        using the bot's skill modifier; if it fails, it tries to use its usual behavior even if such
        a behavior is inappropriate.</p><p>Initial bot reactions depend on their intended role. If
        programmed to attack, their initial response will always be hostile; other bots react
        according to the Reaction Roll, defaulting to an attempt to behave as their programming
        dictates.</p>
