  - name: Ubiquitous
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>Zombie hordes fill particular areas, such as rooms, streets, or entire buildings crawling
        with the undead. Any creature within that area is treated as a valid target for its Savage
        and Ravenous abilities, and anyone trying to move into, out of, or within it is a target for
        Grasping.</p>
      favorite: false
      level: 0
      type: feature
