  biography: >-
    <p><strong>HD</strong> 45 &bull; <strong>AC</strong> None &bull; <strong>Atk</strong> +20 &bull;
    <strong>Dmg</strong> 3d8 &bull; <strong>TR</strong> 1d10/x2 &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> &mdash; &bull; <strong>ML</strong> 12 &bull;
    <strong>Skill</strong> +1 &bull; <strong>Save</strong> 2+</p>

    <p>A large horde is a sea of undead flesh that can fill entire city neighborhoods or sweep over
    small towns.</p><p>Zombie hordes are more akin to an environmental hazard than a conventional
    monster: something to be avoided, distracted, or eliminated with large-scale violence.
    Distracting one requires about a hundred humans as bait, or an equivalent lure, and the baiting
    skill check suffers a -4 penalty.</p>

    <p><em>AC: None.</em> Attacks against this creature hit automatically; the stored Armor Class of
    0 reproduces that in play.</p>

    <p><em>Zombies don't dodge.</em> If you swing or shoot at a zombie, you're going to hit it; the
    only question is whether you do enough damage to drop it. <em>Zombies are durable</em>, ignoring
    food, oxygen, warm clothing, and basic hygiene. <em>Zombies are stupid</em>, and only rare
    subtypes are clever enough to have tactics. <em>Zombies swarm</em> &mdash; one zombie is almost
    harmless, and there is never only one zombie.</p>
