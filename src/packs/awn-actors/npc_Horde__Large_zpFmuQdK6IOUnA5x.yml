  - name: Innumerable
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>Zombie hordes are effectively immune to single-target weapons and special powers. Only
        area-effect damage can disperse them, such as explosives, heavy automatic weapons, building
        collapses, or other effects that could conceivably affect a crowd at once. Fortunately, any
        such attack automatically hits a horde. Hordes reduced to zero hit points have been
        scattered or reduced to a few crippled corpses that any combatant can dispatch. Medium or
        large hordes might leave dangerous clumps of undead behind, however.</p>
      favorite: false
      level: 0
      type: feature
      poolsGranted: []
