  - name: Savage
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>Every round, a horde will use its Main Action to level a single attack at every victim
        within reach of it. It will use its Move action to send a tendril of shambling undead
        towards any victim outside of its immediate reach, closing at the rate of 10 meters per Move
        action. Once the group reaches the target, they are treated as being within the reach of the
        swarm.</p>
      favorite: false
