description: >-
  <p>In some cases, it's unclear whether the animalistic mutants known as "beastfolk" derived from
  modified animals or were born from altered human stock. In either case, the result is a creature
  with a human level of intelligence, but often a very different way of thinking. Most dwell in
  herds, packs, or extended families, with the more humanoid members handling delicate labors and
  the more bestial ones providing raw muscle.</p><p>As a general rule, beastfolk and humans treat
  each other with wariness. Alliances aren't impossible, but they are often fragile. The species
  below are a sampling of those found in the Albuquerque Death Zone; those suitable for use as PCs
  are given Origin Foci, reproduced on the sheets that have them.</p>
