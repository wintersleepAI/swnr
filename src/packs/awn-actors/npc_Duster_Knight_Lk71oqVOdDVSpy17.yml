    <p><strong>HD</strong> 4 &bull; <strong>AC</strong> 16 &bull; <strong>Atk</strong> +7x2 &bull;
    <strong>Dmg</strong> wpn+2 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn+2
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 9 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 13+</p>

    <p>Those humanoids known as the "dusters" are easily recognized by their mirror-bright skin and
    chromed hair, often obscured under a caking of electrostatic dust. Their change appears to have
    been derived from a standardized Highshine protocol for protecting subjects from excessive EMF
    exposure, and even now the occasional unfortunate wanderer ends up "dusty".</p><p>Dusters hear
    and see a wide spectrum of electromagnetic frequencies as noise. While it doesn't impede their
    senses, it's highly irritating to them, and they will avoid electrical devices or radio emitters
    whenever possible. As a consequence, dusters methodically disassemble any electronic devices
    they find and hide away the scrap to prevent its recreation. They don't trade this scrap unless
    the tribe's survival is at stake.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +2 is already set and applies to every weapon damage roll.
    Its Shock is that of its weapon, +2.</p>
