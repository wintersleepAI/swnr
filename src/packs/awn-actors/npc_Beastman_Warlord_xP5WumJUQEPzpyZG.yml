  biography: >-
    <p><strong>HD</strong> 15 &bull; <strong>AC</strong> 18 &bull; <strong>Atk</strong> +20x3 &bull;
    <strong>Dmg</strong> wpn+6 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn+6
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 10 &bull; <strong>Skill</strong> +4
    &bull; <strong>Save</strong> 8+</p>

    <p>More humanoid beastfolk have more human psychology, and often use their more abstract
    thinking abilities to gain high status in their pack. So long as they can satisfy the simple
    desires of their more feral brethren, they can lead them to raid weaker communities or barter
    their labor for valuable goods. The greatest of them weld whole herds and packs into a single
    terrible host.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +6 is already set and applies to every weapon damage roll.
    Its Shock is that of its weapon, +6.</p>
