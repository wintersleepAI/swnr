description: >-
  <p>Some mutations are heritable, or else large populations of baselines might be altered in a
  similar way by the same event. The inevitable costs in longevity and health constrain the growth
  of these mutant bloodlines, but some of them have become sufficiently numerous to maintain their
  own existence.</p><p>The mutant varieties noted here often have special abilities innate to their
  bloodline, but it's also possible for them to have additional alterations from the mutations
  starting on page 16. Leaders and chieftains often have two or three beneficial mutations in
  addition to their usual powers.</p>
