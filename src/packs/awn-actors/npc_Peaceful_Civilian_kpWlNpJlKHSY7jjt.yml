    <p><strong>HD</strong> 1 &bull; <strong>AC</strong> 10 &bull; <strong>Atk</strong> +0 &bull;
    <strong>Dmg</strong> By wpn &bull; <strong>TR</strong> By wpn &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 7 &bull;
    <strong>Skill</strong> +0 &bull; <strong>Save</strong> 15+</p>

    <p><em>Modern Humans.</em> Human Armor Classes reflect the kind of armor such people are likely
    to have acquired; NPCs with specific armor will use their particular ACs.</p>

    <p>An ordinary person with no particular training for violence.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>

    <p><strong>Common Human Weapon Loadouts</strong></p>

    <ul>

    <li><strong>Desperate Refugee:</strong> Knife, 40% chance of a Light or Heavy Pistol</li>

    <li><strong>Neighborhood Militia:</strong> Knife, 50% chance of a Rifle or Shotgun, otherwise an
    axe or melee weapon</li>

    <li><strong>Wasteland Tribal:</strong> Knife, Spear, 50% chance for a primitive bow</li>

    <li><strong>Hardened Modern Survivor:</strong> Knife, Rifle or Shotgun, 20% chance of 1d4 frag
    grenades</li>

    <li><strong>Modern Soldier:</strong> Knife, Combat Rifle, 1d4 frag grenades</li>

    <li><strong>Poor Raider:</strong> Melee weapon, 20% chance of a Pistol, Rifle, or Shotgun</li>

    <li><strong>Veteran Raider:</strong> Melee weapon, Rifle or Shotgun, 20% chance of it being a
    combat version of the gun</li>

    <li><strong>Raider Boss:</strong> Knife, Combat Rifle or Combat Shotgun, 1d6 grenades of
    choice</li>

    </ul>

    <p>For ammo, NPCs will usually have loaded guns and 1d2 extra magazines on their person.</p>
