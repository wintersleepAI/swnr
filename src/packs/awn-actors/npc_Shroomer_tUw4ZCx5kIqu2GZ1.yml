  biography: >-
    <p><strong>HD</strong> 2 &bull; <strong>AC</strong> 14 &bull; <strong>Atk</strong> +3 &bull;
    <strong>Dmg</strong> wpn &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn &bull;
    <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull; <strong>Skill</strong> +1 &bull;
    <strong>Save</strong> 14+</p>

    <p>Fungal life is less susceptible to mutation than more advanced organisms, but even mushrooms
    are sometimes twisted into humanoid forms by the Highshine's warped care. Shroomers spawn in
    nests when a particular mushroom colony triggers a mutation response from the Highshine system.
    Each of the fungal entities is imbued with basic knowledge about the world around them and the
    language of nearby humans.</p><p>Shroomers usually look like hybrid mushroom-humans, normally
    wearing no more than crude tool harnesses and javelin sheaths. They require carrion for health
    and reproduction, and they care little where they find it. Some shroomer nests will make deals
    with human settlements for a steady supply of meat, but others will be just as glad to take it
    by force.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
