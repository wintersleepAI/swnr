    <p>Dry bones and reinforced tendons forced into motion by ancient programming, cybercorpses are
    usually the mindlessly hostile remnants of heavily-cybered site security. They are usually found
    in substantial numbers.</p>

    <p>A cybercorpse strikes for 2d6 with its own augmetics, or uses whatever weapon it still
    carries.</p>

