  biography: >-
    <p><strong>HD</strong> 6 &bull; <strong>AC</strong> 18 &bull; <strong>Atk</strong> +8x2 &bull;
    <strong>Dmg</strong> wpn+3 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn+3
    &bull; <strong>MV</strong> 15m &bull; <strong>ML</strong> 10 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 12+</p>

    <p>Not so much a specific strain as an unfortunately common syndrome, morlocks are those
    wretches who have been shaped in painful ways by the Highshine. Twisted and deformed, they pass
    their suffering on to new generations through birth or grim surgical rituals.</p><p>Morlocks
    commonly hate baselines out of envy and the inevitable competition for resources. Morlock tribes
    will gladly raid human settlements or ambush careless caravans, only to retreat to their caves
    and sewer tunnels before the baselines can retaliate. While the Highshine has marred them, it
    has also made them strong; morlocks have a toughness and physical prowess far superior to those
    of ordinary humans, though it usually comes at a cost of perpetual pain and a shortened
    lifespan.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +3 is already set and applies to every weapon damage roll.
    Its Shock is that of its weapon, +3.</p>
