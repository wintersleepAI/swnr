    wpn &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 13+</p>

    <p>These androids were built to resemble humans, some of them with unsettling accuracy. Most
    were intended for human interaction of some sort, so they are among the most likely robots to
    engage peacefully with modern survivors. Even so, they remain mere expert systems, and will
    often try to apply their original programming even when it is inappropriate.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
