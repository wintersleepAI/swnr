    <p><strong>HD</strong> 1 &bull; <strong>AC</strong> 13 &bull; <strong>Atk</strong> +4 &bull;
    <strong>Dmg</strong> 1d6+poison &bull; <strong>TR</strong> 1d6/x2 &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 11 &bull;
    <strong>Skill</strong> +2 &bull; <strong>Save</strong> 14+</p>

    <p>This species of mutated, man-sized rattlesnake was cursed by the Highshine. Its altered
    genome prevents it from forming scales, leaving its body raw and red while the Highshine nanites
    force homeostasis and prevent it from dying of infection or fluid loss. The perpetual torment it
    experiences leaves it with a savage temper.</p><p>Flaysnakes are normally found alone or in
    briefly-mated pairs.</p>
