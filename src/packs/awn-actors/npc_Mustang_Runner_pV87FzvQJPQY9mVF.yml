  biography: >-
    <p><strong>HD</strong> 2 &bull; <strong>AC</strong> 12 &bull; <strong>Atk</strong> +3 &bull;
    <strong>Dmg</strong> wpn &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn &bull;
    <strong>MV</strong> 15m &bull; <strong>ML</strong> 8 &bull; <strong>Skill</strong> +1 &bull;
    <strong>Save</strong> 14+</p>

    <p>Progeny of the herds of wild horses that once roamed the zone, mustangs have an exceptionally
    wide range of physical forms. "Mustangs" proper are humanoid in shape, and aren't as equipped
    for roaming as their equine brethren; they usually settle together in small villages along
    common herd routes. They provide protection and assistance for the broncos in exchange for draft
    labor and riding mounts.</p>

    <p>With some appearing quite human aside from their ears and tails, mustangs occasionally broker
    labor agreements with baseline settlements. Such communities usually have extremely strict rules
    about the treatment of horses.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
