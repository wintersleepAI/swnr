  biography: >-
    <p><strong>HD</strong> 10 &bull; <strong>AC</strong> None &bull; <strong>Atk</strong> +13x2
    &bull; <strong>Dmg</strong> 2d8 &bull; <strong>TR</strong> 1d8/x3 &bull; <strong>Shock</strong>
    10/- &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 12 &bull; <strong>Skill</strong>
    +2 &bull; <strong>Save</strong> 10+</p>

    <p>Monstrous giants of dead flesh and undying hunger, these abominations are usually surrounded
    by swarms of lesser undead. Most are mindless agents of destruction, but they usually have
    several special abilities related to their uncanny nature.</p>

    <p><em>AC: None.</em> Attacks against this creature hit automatically; the stored Armor Class of
    0 reproduces that in play.</p>

    <p><em>Special abilities.</em> The stat line marks 3 picks from the Zombie Special Abilities
    list (AWN p.225), reproduced on this sheet.</p>

    <p><em>Zombies don't dodge.</em> If you swing or shoot at a zombie, you're going to hit it; the
    only question is whether you do enough damage to drop it. <em>Zombies are durable</em>, ignoring
    food, oxygen, warm clothing, and basic hygiene. <em>Zombies are stupid</em>, and only rare
    subtypes are clever enough to have tactics. <em>Zombies swarm</em> &mdash; one zombie is almost
    harmless, and there is never only one zombie.</p>
