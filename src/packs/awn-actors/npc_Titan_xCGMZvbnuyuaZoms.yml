  - name: Zombie Special Abilities (3 picks)
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>Most zombies rely on the tried-and-true tactics of Swarm Attacks, grapples, and biting.
        Some zombies deserve to be bigger threats, however, and a GM might choose to assign them one
        of the special zombie abilities described below or make up one of their own.</p>

        <ul>

        <li><strong>Cannibal Vigor:</strong> If the zombie spends a Main Action feasting on a dead
        or incapacitated human, it regains half its maximum hit points. A given victim can be used
        as food only once.</li>

        <li><strong>Cunning:</strong> The zombie actually has some shred of human intellect
        remaining, and can exhibit tactical understanding. Mindless zombies in its presence will
        obey its commands, if they're simple enough and not contrary to their hungers.</li>

        <li><strong>Deathless Regrowth:</strong> The zombie regenerates 8 hit points at the end of
        each of its turns.</li>

        <li><strong>False Friend:</strong> The zombie is so intact that it looks like a perfectly
        normal human being, if withdrawn and quiet. It instinctively uses this appearance to bait
        human prey.</li>

        <li><strong>Frenzied Hunger:</strong> Any human-sized victim it grapples for more than one
        round must make a Physical saving throw at the start of their turn. On a failure, they are
        ripped to pieces by the zombie, which will do nothing but feast on their corpse until it is
        attacked.</li>

        <li><strong>Hasty:</strong> If the zombie is not within melee range of a target, it gets a
        bonus Move and Main Action which it will use to try to close with a victim and attack.</li>

        <li><strong>Hulking:</strong> The zombie is huge for one of its kind. All of its hit dice
        count as if it had rolled an 8 for each.</li>

        <li><strong>Latch On:</strong> When one of the zombie's normal attacks hits, it
        automatically makes a grapple attempt on the target.</li>

        <li><strong>Miasmatic:</strong> A terrible stench exudes from the corpse, applying a -2
        penalty to the AC and hit rolls of all enemies within 10 meters.</li>

        <li><strong>Quick and Dead:</strong> The zombie's base movement rate is doubled.</li>

        <li><strong>Razor Claws:</strong> The zombie has unnaturally sharp or massive claws, bone
        spurs, teeth, or other body weaponry. Its attacks all do +3 damage and it has a Shock rating
        of 3/- if not better already.</li>

        <li><strong>Relentless Hunter:</strong> The zombie has a total +5 skill bonus for detecting
        stealth attempts and cannot be surprised. It and any companions it has will follow any prey
        without ceasing for 1d6 hours.</li>

        <li><strong>Thick Hide:</strong> The zombie is tough to hurt, having an Armor Class equal to
        12 plus their hit dice.</li>

        <li><strong>Venom Spit:</strong> As a Main Action, the zombie can spew some noxious
        substance up to 30 meters, attacking and inflicting damage as if with their normal
        attack.</li>

        </ul>
