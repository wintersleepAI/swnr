  biography: >-
    <p><strong>HD</strong> 3 &bull; <strong>AC</strong> 20 &bull; <strong>Atk</strong> +3x2 &bull;
    <strong>Dmg</strong> 1d4+poison &bull; <strong>TR</strong> &mdash; &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull;
    <strong>Skill</strong> +2 &bull; <strong>Save</strong> 14+</p>

    <p>Just as shroomers are born of fungi, thornies are the result of the Highshine's hybridization
    of plant life and humanity. While their appearance depends on the type of vegetation they were
    derived from, most are notable for the toxic thorns that stud their fibrous
    limbs.</p><p>Thornies are extremely long-lived and placid as a rule, content to sun themselves
    and drink through their toe-roots. They keep aloof from the affairs of "walkers", and few thorny
    villages have anything that outsiders would want in the first place. The exception is knowledge:
    as long-lived and contemplative as thornies are, many retain secrets and wisdom long since lost
    to the outside world. They have been known to barter this lore for help in dealing with threats
    and problems within their own settlement.</p>
