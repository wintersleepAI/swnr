  biography: >-
    <p><strong>HD</strong> 3 &bull; <strong>AC</strong> 17 &bull; <strong>Atk</strong> +4 &bull;
    <strong>Dmg</strong> 1d8+2 bite &bull; <strong>TR</strong> 1d6/x2 &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull;
    <strong>Skill</strong> +2 &bull; <strong>Save</strong> 14+</p>

    <p>These beasts are mutant walruses who have grown finger-like manipulators along the edges of
    their flippers and a split trunk to form stubby legs. They can operate both on land and in the
    water, and are known for launching attacks on coastal communities and unwary fishing boats. Some
    coastal waters are so infested with these creatures that sea travel is all but
    impossible.</p><p>Most have only a feral degree of awareness, but a few communities of whiskered
    devils have been uplifted by Highshine and given a near-human intellect. These packs often
    become slavers, taking human thralls to work island crops or perform labors that clumsy
    flipper-fingers cannot do.</p><p>Whiskered devils usually swim in small groups of 1d4, but a
    raiding party will number 3d6 of them.</p>
