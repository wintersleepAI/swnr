description: >-
  <p>Two centuries after the Scream, the iron ghosts of the Corporate Age still haunt the world.
  Every so often a scavenger will find a functioning corper implant lab or a stash of still-operable
  corporate cyber, and the possibilities of power will overwhelm their caution. Worse still, some of
  the ancient nemesis borgs and contract enforcement organisms of the original megacorps still
  maintain their functionality, waiting for the day that some unlucky intruder wakes them from their
  graves.</p>
