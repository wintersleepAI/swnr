    <p><strong>HD</strong> 4 &bull; <strong>AC</strong> 15 &bull; <strong>Atk</strong> +6x2 &bull;
    <strong>Dmg</strong> 1d8 bite &bull; <strong>TR</strong> 1d8/x2 &bull; <strong>Shock</strong>
    3/- &bull; <strong>MV</strong> 15m &bull; <strong>ML</strong> 9 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 13+</p>

    <p>A loathsome cross between a black bear's body and the fanged head of a human, ghoul bears
    possess a human degree of intelligence but never communicate except to perfectly mimic the cries
    and pleas of their past victims. They eat carrion, but are notorious for prowling around the
    edges of enclaves, tempting in prey with stupefying cries for help.</p><p>Ghoul bears usually
    hunt alone, but occasionally a family of 1d4 of them is encountered.</p>
