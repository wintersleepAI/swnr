    <strong>Skill</strong> +2 &bull; <strong>Save</strong> 14+</p>

    <p>Most flying robots were wiped out by the Bright Mirror defense system, but a few models had
    acceptable verification codes. The buzzard-like vultron was one of them, hovering with its
    black-feathered grav units and spitting lethal laser bolts at prey below. A vultron never flies
    higher than 30 meters above the ground.</p>
