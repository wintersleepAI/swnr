  biography: >-
    <p><strong>HD</strong> 1 &bull; <strong>AC</strong> 16 &bull; <strong>Atk</strong> +3 &bull;
    <strong>Dmg</strong> wpn &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn &bull;
    <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull; <strong>Skill</strong> +1 &bull;
    <strong>Save</strong> 15+</p>

    <p>Uncommon even by beastfolk standards, these humanoid turtles tend to favor their animal
    natures in appearance. Even so, a few of them are born with a more kappa-like appearance and
    smaller dorsal shells, and could pass for human beneath a heavy cloak.</p>

    <p>Turtlekin are naturally contemplative and inclined to peaceful behavior. Their inoffensive
    manner sometimes entices raiders, however, and so a tradition of martial discipline has been
    cultivated by some villages.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
