    <p><strong>HD</strong> 1 &bull; <strong>AC</strong> 15 &bull; <strong>Atk</strong> +4 &bull;
    <strong>Dmg</strong> wpn+2 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 7 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 15+</p>

    <p>Born of a Highshine-induced cross of humanity and the ubiquitous black-tailed jackrabbits of
    the Albuquerque Death Zone, male jacks and female jills are usually slightly smaller than
    baseline humans. Some are recognizable only by their long ears, while others are so lapine as to
    have muzzles and furred bodies.</p>

    <p>Jackfolk are high-strung, watchful mutants by nature, most of them living together in
    settlements that survive by hunting and simple agriculture. Some of the bolder ones act as
    tinkers and peddlers, trusting in their superior speed and alertness to see them through the
    dangers of the zone.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +2 is already set and applies to every weapon damage
    roll.</p>
