  biography: >-
    <p><strong>HD</strong> 6 &bull; <strong>AC</strong> 16 &bull; <strong>Atk</strong> +9 &bull;
    <strong>Dmg</strong> wpn+2 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn+2
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 9 &bull; <strong>Skill</strong> +2
    &bull; <strong>Save</strong> 12+</p>

    <p>The strongest of a wolfman pack leads it. "Domesticated" subtypes derived from human pets
    have a different psychology; these "dogfolk" have an inbred need for human companionship and an
    almost instinctive desire to follow a human leader. Some "bad dogs" manage to overcome their own
    instincts through willpower or sheer mistreatment and can sometimes become leaders of rebel
    packs or vicious raiders. The emotional trauma of their rebellion tends to make them highly
    unstable, however, and prone to lashing out at perceived threats.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +2 is already set and applies to every weapon damage roll.
    Its Shock is that of its weapon, +2.</p>
