    <strong>Size</strong> Medium &bull; <strong>Hardpoints</strong> 1</p><p>This relatively small
    helicopter is more likely than its larger brethren to have survived the collapse in operable
    conditions. It can cross a hex of terrain in 0.1 hours of travel and can land anywhere a flat
    surface is available. Helicopters are very finicky beasts, however, and require an hour of
    maintenance by someone with Fix-1 skill and ten units of scrap for every hour of operation. A
    helicopter is too complex to rebuild from scrap.</p>
