    <strong>MV</strong> 10m &bull; <strong>ML</strong> 7 &bull; <strong>Skill</strong> +2 &bull;
    <strong>Save</strong> 15+</p>

    <p>The natural heirs of humanity's remains, the ratfolk are short, slight humanoids with naked
    tails and pronounced ears. The more feral varieties are pelted and stooped, but all have nimble
    hands and agile feet.</p>

    <p>Ratfolk are highly social, and most of the hours in their settlements not spent on survival
    are spent in talking, arguing, bargaining, and threatening each other. Consummate survivors,
    they are timid when alone, paranoid around danger, and always ready to do whatever is necessary
    to keep their skin intact. They make many bargains but keep only the useful ones. A ratman will
    scheme for food, mates, and safety, but seldom do their plans reach farther than a full
    belly.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
