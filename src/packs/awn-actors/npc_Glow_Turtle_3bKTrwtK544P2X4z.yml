  biography: >-
    <p><strong>HD</strong> 5 &bull; <strong>AC</strong> 18 &bull; <strong>Atk</strong> +6 &bull;
    <strong>Dmg</strong> 1d10 bite &bull; <strong>TR</strong> 1d6/x2 &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 15m &bull; <strong>ML</strong> 8 &bull;
    <strong>Skill</strong> +2 &bull; <strong>Save</strong> 13+</p>

    <p>These bad-tempered tortoises are as tall as a man at the peak of their glowing shells and are
    found anywhere they can get adequate vegetation to eat. Their bodies process the accumulated
    radioactivity and toxins into their shells, which glow bright blue in warning. Glow turtles are
    herbivores but will attack interlopers, and can move with surprising quickness over short
    distances.</p><p>Glow turtles are only ever encountered singly.</p>
