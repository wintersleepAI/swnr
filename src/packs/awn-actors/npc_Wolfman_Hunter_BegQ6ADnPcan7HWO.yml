    <p><strong>HD</strong> 2 &bull; <strong>AC</strong> 14 &bull; <strong>Atk</strong> +3 &bull;
    <strong>Dmg</strong> wpn &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn &bull;
    <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull; <strong>Skill</strong> +1 &bull;
    <strong>Save</strong> 14+</p>

    <p>Big, pelted, and fierce, the wolfmen of the hills and forests are naturally aggressive
    hunters who prefer to live in extended-family packs that meet only to exchange mates and conduct
    trade. While wolfmen usually stay in the wilds, a lack of game or forage can send them to raid
    human settlements for food. They tend to be among the more feral of beastfolk, with little
    interest in the finer points of technical knowledge or in forming abstract goals.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
