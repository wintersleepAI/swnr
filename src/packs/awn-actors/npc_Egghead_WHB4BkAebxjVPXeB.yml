  biography: >-
    <p><strong>HD</strong> 5 &bull; <strong>AC</strong> 15 &bull; <strong>Atk</strong> +8 &bull;
    <strong>Dmg</strong> wpn+2 &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn
    &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 8 &bull; <strong>Skill</strong> +3
    &bull; <strong>Save</strong> 13+</p>

    <p>These mutants are distinguished by hairless, swollen heads with half-formed facial features.
    Most conceal their faces behind scavenged masks, and remove them only as a gesture of
    surrender.</p><p>Eggheads have extremely powerful pseudo-psychic abilities. While not true
    psionic powers, they all have at least two or three of the pseudo-psychic mutations listed in
    that section, their leaders have four or five, and their greatest talents have all of them.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +2 is already set and applies to every weapon damage
    roll.</p>
