  - name: Brainmelter
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>All intelligent creatures within ten meters of an egghead must make a Mental saving
        throw. On a failure, they will cooperate with the egghead's telepathic instructions unless
        those commands would put them in danger or be extremely out of character. This influence
        lasts until the egghead leaves or demonstrates overt hostility to the subjects. A creature
        can be targeted by this effect only once per scene.</p><p>An egghead can suppress this
        pacifying field when desired, but few do.</p>
