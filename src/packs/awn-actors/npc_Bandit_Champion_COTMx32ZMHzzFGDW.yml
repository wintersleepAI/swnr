items:
  - name: Human Special Abilities (2 picks)
    type: feature
    img: systems/swnr/assets/icons/game-icons.net/item-icons/reticule.svg
    system:
      description: >-
        <p>The special combat powers below might derive from mutations, latent psychic abilities,
        customized tech, or sheer natural talent. Enemies with asterisks behind their hit dice will
        usually have one or more of these abilities, but the occasional lucky grunt might have one
        as well.</p>

        <ul>

        <li><strong>Berserker:</strong> When reduced to zero hit points, the NPC can continue acting
        for 1d4+1 rounds before becoming Mortally Wounded, provided they try to kill someone each
        round.</li>

        <li><strong>Body Shield:</strong> If a minion or helpless victim is within melee range when
        the NPC is hit, as an Instant action they can shunt the damage to them.</li>

        <li><strong>Bonus Firepower:</strong> The NPC and their allies have access to a heavy
        weapon, high explosives, or other unexpectedly serious combat gear.</li>

        <li><strong>Bulletproof:</strong> The NPC's natural Armor Class is 20, or +2 if already 20
        or higher.</li>

        <li><strong>Crushing Blow:</strong> The NPC adds their hit dice to the damage done by a
        weapon hit.</li>

        <li><strong>Fleet of Foot:</strong> The NPC gains a bonus Move action each round.</li>

        <li><strong>Ghost:</strong> The NPC has the benefit of the Ghost Edge.</li>

        <li><strong>Greased Lightning:</strong> The NPC gets a bonus Main Action each round.</li>

        <li><strong>Guns Blazing:</strong> When shooting, the NPC can make twice as many attacks as
        usual with a single Main Action.</li>

        <li><strong>Hard Case:</strong> The NPC has eight hit points for each of their hit
        dice.</li>

        <li><strong>Lethal Aim:</strong> The NPC gets a +2 bonus to all Trauma Rolls they might
        make, if the campaign uses Traumatic Hit rules.</li>

        <li><strong>Living Banner:</strong> The NPC's Morale becomes 12, and their immediate allies
        automatically pass all Morale checks.</li>

        <li><strong>Luck of the Damned:</strong> Once per scene, as an Instant action, the NPC can
        automatically make a saving throw or negate a weapon hit against them.</li>

        <li><strong>Nine Lives:</strong> The first time the NPC is reduced to zero hit points in a
        week by a survivable injury, they regain half their maximum HP.</li>

        <li><strong>Only a Flesh Wound:</strong> The NPC's Trauma Target is 8 instead of the usual
        6, if the campaign uses Traumatic Hit rules.</li>

        <li><strong>Paranoid:</strong> The NPC and their group cannot be surprised or suffer from
        Execution Attacks.</li>

        <li><strong>Rallying Cry:</strong> Once per scene, as a Main Action, the NPC can rally all
        allies within 30 meters, giving them 1d8 bonus HP for the rest of the scene and getting any
        non-extremely-dead allies back on their feet until the scene ends.</li>

        <li><strong>Sure Shot:</strong> The NPC's hit bonus is increased by their hit dice.</li>

        <li><strong>Toxic Blades:</strong> The NPC's melee hits, but not Shock, inflict 1d6
        additional System Strain, leaving the victim Mortally Wounded if that would put them over
        their maximum.</li>

        <li><strong>Unshockable:</strong> The NPC is immune to Shock damage.</li>

        <li><strong>Veteran's Luck:</strong> The NPC has the benefit of the Veteran's Luck
        Edge.</li>

        <li><strong>Wall of Lead:</strong> As a Main Action, the NPC can blaze away with a gun to
        use Suppressive Fire rules against as many targets in range as they have bullets left.</li>

        </ul>
