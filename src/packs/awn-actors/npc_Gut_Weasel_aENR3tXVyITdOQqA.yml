    <p>These miniature mutated wolverines possess a vicious disposition, even though they seldom
    weigh more than five or six kilos. Their blinding speed and diamond-hard claws aid their
    preferred hunting tactic of aiming directly for the entrails of their prey.</p><p>Gut weasels
    are usually solitary, though a mated pair can sometimes be unfortunately encountered.</p>
