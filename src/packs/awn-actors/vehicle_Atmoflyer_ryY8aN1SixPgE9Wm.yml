    <strong>Size</strong> Large &bull; <strong>Hardpoints</strong> 2</p><p>One of a variety of
    high-tech helicopters, VTOL aircraft, or jets, a properly maintained atmoflyer can reach any
    point on the planet within an hour and land on any reasonably flat patch of ground. In the
    example Terran Mandate campaign setting provided in this book, however, their use has been
    sharply curtailed by the planet’s orbital defense grid, which automatically annihilates any
    inorganic flying vehicle that dares to leave the ground. An atmoflyer is too complex to rebuild
    from scrap.</p>
