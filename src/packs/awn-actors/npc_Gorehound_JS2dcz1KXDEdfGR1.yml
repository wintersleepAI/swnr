  biography: >-
    <p><strong>HD</strong> 2 &bull; <strong>AC</strong> 13 &bull; <strong>Atk</strong> +3 &bull;
    <strong>Dmg</strong> 1d6+ bite &bull; <strong>TR</strong> 1d6/x2 &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 15m &bull; <strong>ML</strong> 8 &bull;
    <strong>Skill</strong> +1 &bull; <strong>Save</strong> 14+</p>

    <p>These heirs of once-docile domestic pets have been warped into something more survivable by
    the Highshine. Now standing waist-high on a human, their large braincases betray the augmented
    intelligence they display. Some of them are as intelligent as a human, though all of them are
    suffused with a malicious, hateful spirit of sadistic aggression towards non-canines. They hunt
    with expert coordination and can fully understand human tricks and technology.</p><p>Gorehounds
    are found in packs of 2d4 animals. Occasionally a very intelligent one bonds with a human of
    similar cruel temperament, enjoying the leftovers of their "master" until it becomes convenient
    to eat him, too.</p><p><em>The printed stat line gives the bite damage as "1d6+", with no bonus
    specified; 1d6 is used here.</em></p>
