    <p><strong>HD</strong> 1 &bull; <strong>AC</strong> 14 &bull; <strong>Atk</strong> +1 &bull;
    <strong>Dmg</strong> 1d4 claw &bull; <strong>TR</strong> 1d8/x2 &bull; <strong>Shock</strong>
    &mdash; &bull; <strong>MV</strong> 10m &bull; <strong>ML</strong> 7 &bull;
    <strong>Skill</strong> +2 &bull; <strong>Save</strong> 15+</p>

    <p>A Highshined owl derivative with a long, serrated beak and glass-sharp claws, a blinder bird
    has a special craving for blood and a tendency to aim for a victim's eyes. The bird swoops down
    silently to rake its unsuspecting prey before licking the blood or aqueous humour from its
    claws.</p><p>Blinder birds are usually found in flocks of 1d8.</p>
