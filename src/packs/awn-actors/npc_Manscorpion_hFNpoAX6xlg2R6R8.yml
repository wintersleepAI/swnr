  biography: >-
    <p><strong>HD</strong> 3 &bull; <strong>AC</strong> 15 &bull; <strong>Atk</strong> +5x3 &bull;
    <strong>Dmg</strong> 1d6 claw/sting &bull; <strong>TR</strong> 1d6/x2 &bull;
    <strong>Shock</strong> &mdash; &bull; <strong>MV</strong> 15m &bull; <strong>ML</strong> 9
    &bull; <strong>Skill</strong> +2 &bull; <strong>Save</strong> 14+</p>

    <p>These horse-sized devils have the body of a scorpion mated to a humanoid torso and an
    insectile, mandibled head. They prefer to nest in human ruins and use their hardened climbing
    claws to ascend to high lairs. They do not appear to have any human kind of intelligence, and do
    not use tools in their hunts. They often ambush their prey, stinging them and then retreating
    until their poison has had time to work.</p><p>Manscorpions hunt alone, but their nests will
    have 2d6 adults.</p>
