    <p><strong>HD</strong> 1 &bull; <strong>AC</strong> 15 &bull; <strong>Atk</strong> +3 &bull;
    <strong>Dmg</strong> wpn &bull; <strong>TR</strong> wpn &bull; <strong>Shock</strong> wpn &bull;
    <strong>MV</strong> 10m &bull; <strong>ML</strong> 9 &bull; <strong>Skill</strong> +1 &bull;
    <strong>Save</strong> 15+</p>

    <p>Spike-horned and slender, the goatfolk of the hills and mountains are notoriously fractious,
    troublesome, and lascivious. Every billy or nanny has a natural disposition to ignore any rules
    or demands made by someone else and an intrinsic desire to prove themselves independent and
    self-sufficient. Among their own kind, status is based on altitude; skill and daring are
    celebrated as "high" virtues, and the most socially-dominant goatman is always at the highest
    physical point of any village.</p>

    <p>Goatfolk are rarely an organized threat to baseline humans, but they are notorious raiders
    and thieves and are often unwelcome in human communities. This, of course, just makes some of
    them want all the more badly to go there.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it.</p>
