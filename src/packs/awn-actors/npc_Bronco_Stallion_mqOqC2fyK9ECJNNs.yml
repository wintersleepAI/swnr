    <strong>Skill</strong> +1 &bull; <strong>Save</strong> 14+</p>

    <p>"Broncos" are completely equine in body, though they possess human levels of intelligence.
    Horse-like members of the species tend to have extremely equine minds; grazing, treats, and
    mates are all that particularly interest them. They move in herds led by a matriarch, with
    stallions bringing up the rear to guard the rest of the herd. At times a bronco forms a bond of
    friendship with a baseline or other mutant, serving as a loyal steed.</p>
