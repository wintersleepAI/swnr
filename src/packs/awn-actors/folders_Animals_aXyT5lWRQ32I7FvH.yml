description: >-
  <p>Most animals in the modern world have a long-taught aversion to human contact. Only in the
  rarest cases will a predator turn maneater, most often when it's too weak or crippled to hunt its
  usual prey, or when the human in question is just too feeble and alone to ignore.</p>

  <p>These rules might change after a societal collapse. Predators can learn new tricks after
  glutting themselves on the corpses of the dead, and the remaining human survivors will have almost
  certainly decimated any prey animals in the area.</p>
