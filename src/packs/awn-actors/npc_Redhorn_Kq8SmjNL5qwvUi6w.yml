    <p><strong>HD</strong> 3 &bull; <strong>AC</strong> 14 &bull; <strong>Atk</strong> +3x4 &bull;
    <strong>Dmg</strong> 1d6 claw/gore &bull; <strong>TR</strong> 1d6/x3 &bull;
    <strong>Shock</strong> &mdash; &bull; <strong>MV</strong> 15m &bull; <strong>ML</strong> 8
    &bull; <strong>Skill</strong> +1 &bull; <strong>Save</strong> 14+</p>

    <p>These mutant cattle are a scourge on the dry pastures of the Albuquerque Death Zone. They are
    omnivorous with a preference for meat, impossible to domesticate, and a constant threat to the
    herds of the settled communities. They appear as emaciated bovines with curved horns, hidden
    fangs, and retractable hoof-claws. Some are clever enough to hide among herds of more ordinary
    cattle in order to avoid cowboy patrols.</p><p>Redhorns hunt in small groups of 1d4, these small
    bands joining together nightly into herds of 2d6.</p>
