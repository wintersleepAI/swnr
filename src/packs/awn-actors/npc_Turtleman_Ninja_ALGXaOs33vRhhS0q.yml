    &bull; <strong>Save</strong> 12+</p>

    <p>Some of the younger warriors of the turtlekin villages can be dissatisfied by the quiet of
    their home settlements, and venture out into the world to find more interesting things to
    consider. The martial tradition cultivated against raiders makes them formidable company.</p>

    <p><em>Weapons.</em> This NPC fights with whatever gear it carries; drop weapon items onto the
    sheet to arm it. Its Damage Bonus of +3 is already set and applies to every weapon damage roll.
    Its Shock is that of its weapon, +3.</p>
