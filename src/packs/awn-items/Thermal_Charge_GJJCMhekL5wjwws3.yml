  description: >-
    <h3>Weapon Mod</h3><p><strong>Skill:</strong> Fix-2 &bull; <strong>Scrap Required:</strong> 30
    &bull; <strong>Special Tech:</strong> 0</p><p><strong>Effect:</strong> +2 heat damage and Shock
    for two fights.</p><h3>Description</h3><p>Usable only on melee or thrown weapons, the mod adds a
    bank of heat cells to the weapon. The weapon then inflicts +2 damage and Shock to all creatures
    not impervious to heat. The cells are activated as an On Turn action, but last for only two
    fights before requiring an hour to let the elements cool.</p><p><em>This mod is only appropriate
    for sci-fi settings or other campaigns with advanced tech.</em></p>
