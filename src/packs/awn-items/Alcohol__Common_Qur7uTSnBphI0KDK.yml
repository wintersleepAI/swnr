    <h3>Description</h3><p>From prison rotgut to rare vintages, booze is universally valuable. One
    dose is generally enough alcohol to render a drinker pleasantly tipsy but not incapacitated. The
    effects last 1d4 hours and decrease any Stress gained during that time by 1 point, though users
