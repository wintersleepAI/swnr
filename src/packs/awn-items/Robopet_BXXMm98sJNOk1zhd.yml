    strength of a large housecat and has stats of 5 HP, AC 15, Move 10m, Save 15+, and Skill +1. It
    self-repairs 1 HP per day.</p><h3>Power and Use</h3><p>Requires a Type A energy cell to
    activate, and functions for one scene per use.</p><p>Unless specified otherwise, this device
    requires a Main Action to trigger its activation.</p>
