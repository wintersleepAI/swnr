  description: >-
    <h3>Special:</h3><ul><li>This weapon’s damage is always non-lethal, unless desired otherwise.
    Non-lethal hits don’t roll the Trauma Die.</li></ul><h3>Description:</h3><p>Grenades always roll
    their attack rolls against AC 10. On a hit, the grenade lands where it was intended. On a miss,
    it misses by 1d10 meters in a random direction.</p><p>Gas grenades create a 5-meter radius cloud
    of opaque, choking gas that disperses in one round. The damage they inflict is non-lethal, with
    a Physical save to halve it. They are useless against targets with breathing protection. The gas
    cloud provides everyone within it with full concealment.</p>
