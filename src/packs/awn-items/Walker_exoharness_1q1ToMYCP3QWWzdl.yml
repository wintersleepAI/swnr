    exoharness’ onboard nav functionality.</p><h3>Power and Use</h3><p>Requires a Type A energy cell
    to power it each time it is activated, and functions for the listed duration, or one round or
    action if not indicated.</p><p>Unless specified otherwise, this device requires a Main Action to
    trigger its activation.</p>
