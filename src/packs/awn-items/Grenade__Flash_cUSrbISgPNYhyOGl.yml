  description: >-
    <h3>Description:</h3><p>Grenades always roll their attack rolls against AC 10. On a hit, the
    grenade lands where it was intended. On a miss, it misses by 1d10 meters in a random
    direction.</p><p>Flash grenades force victims within 5 meters without eye and ear protection to
    make a Physical save; on a failure, they lose their next Main Action and take a -2 penalty to AC
    and hit rolls for the next 1d6 rounds. Flash grenade effects don’t stack, and a target who makes
    their save cannot be flashbanged again that round.</p>
