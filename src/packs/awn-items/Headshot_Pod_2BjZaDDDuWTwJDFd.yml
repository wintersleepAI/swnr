    Large</p><h3>Description</h3><p>Headshot pods are a family of guided missiles meant for mounted
    deployment on vehicles or large drones. They always target AC 10 to hit, but require two full
    consecutive rounds of aiming at a visible target to get a target lock on them and prime for
    firing on the third round. Any bystanders within 5 meters of the impact take damage as if from a
    frag grenade. A headshot pod missile takes 20 TL3 scrap to build. This weapon’s Trauma Die can
    inflict Traumatic Hits on drones, vehicles, and other machines.</p>
