  description: >-
    <h3>High-Tech Device</h3><p><strong>Category:</strong> Household Goods &bull;
    <strong>Rarity:</strong> Uncommon</p><h3>Description</h3><p>Fashionable jewelry with a
    discreetly hidden trigger. When activated, the user gains unusual flexibility and grace, gaining
    a +1 Dex modifier up to a +2 maximum for the scene. Unfortunately, they are forced to do nothing
    but dance for the first 1d6 rounds of activation. The device burns out on a 1 in 6 after each
    use.</p><h3>Power and Use</h3><p>Functions indefinitely on its own power, though particularly
    abusive use might run it down prematurely.</p><p>Unless specified otherwise, this device
    requires a Main Action to trigger its activation.</p>
