  description: >-
    <h3>Description</h3><p>A ubiquitous emergency stim in pre-collapse medical supplies, a trauma
    patch can stabilize a Mortally Wounded victim on a successful Int or Dex/Heal skill check
    against a difficulty of 6 plus 1 for each full round since the subject went down. A failed
    attempt can be tried again with a fresh patch. The patch is useless after six rounds. Trauma
    patches can’t revive victims downed by poison, explosives, or other massive trauma. Unlike most
    stims, trauma patches are bulky, and count as one item of Encumbrance.</p>
