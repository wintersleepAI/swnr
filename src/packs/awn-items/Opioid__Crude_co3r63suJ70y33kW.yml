  description: >-
    <h3>Description</h3><p>Painkillers, euphorics, and other opium-like drugs can make a user feel
    far better than they actually are. Crude pain pills or black tar grant 1d10 temporary hit points
    for an hour that can bring a user’s hit points over their normal maximum. At the hour’s end,
    these points vanish but leave the user with at least 1 HP remaining. The user adds 1 System
    Strain the first time they take damage while under the drug’s effects.</p>
