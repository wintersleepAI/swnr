  description: >-
    <h3>Weapon Mod</h3><p><strong>Skill:</strong> Fix-1 &bull; <strong>Scrap Required:</strong> 10
    &bull; <strong>Special Tech:</strong> 0</p><p><strong>Effect:</strong> Retrieves a thrown weapon
    as an On Turn action.</p><h3>Description</h3><p>A thrown weapon is linked to a wrist spool with
    retractable wires that allow its retrieval as an On Turn action. The wires can be cut by a
    properly-timed attack with a sharp weapon, but are too thin and sharp to be easily grabbed. The
    wires can drag up to 20 kilos when retracting. Replacing broken wires takes 15
    minutes.</p><p><em>This mod is only appropriate for sci-fi settings or other campaigns with
    advanced tech.</em></p>
