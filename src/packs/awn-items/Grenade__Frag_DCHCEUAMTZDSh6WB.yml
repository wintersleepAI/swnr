system:
  description: >-
    <h3>Description:</h3><p>Grenades always roll their attack rolls against AC 10. On a hit, the
    grenade lands where it was intended. On a miss, it misses by 1d10 meters in a random
    direction.</p><p>Frag grenades inflict 2d6 damage on all within 5 meters, plus the chance of a
    Traumatic Hit if those rules are being used. An Evasion save halves the grenade’s damage, and
    that damage is reduced by 1 point for every AC point above 14 the target has, down to a minimum
    of zero damage.</p>
