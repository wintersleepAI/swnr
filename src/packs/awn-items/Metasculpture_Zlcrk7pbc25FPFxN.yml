  description: >-
    <h3>High-Tech Device</h3><p><strong>Category:</strong> Art &amp; Personal Effects &bull;
    <strong>Rarity:</strong> Common</p><h3>Description</h3><p>A bundle of pale, clay-like material
    with a sensor patch on one end. By touching the patch and imagining an object of 1 Enc or less,
    the metasculpture becomes it over the course of one minute. It has the strength of steel, and
    can mimic objects with moving parts but not electronic ones.</p><h3>Power and
    Use</h3><p>Requires a Type A energy cell to power it each time it is activated, and functions
    for the listed duration, or one round or action if not indicated.</p><p>Unless specified
    otherwise, this device requires a Main Action to trigger its activation.</p>
