    other area effects from inside the box affect both locations.</p><p><em>1 Encumbrance
    each.</em></p><h3>Power and Use</h3><p>Functions indefinitely on its own power, though
    particularly abusive use might run it down prematurely.</p><p>Unless specified otherwise, this
    device requires a Main Action to trigger its activation.</p>
