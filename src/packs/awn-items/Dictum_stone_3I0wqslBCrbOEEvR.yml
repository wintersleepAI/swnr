  description: >-
    <h3>High-Tech Device</h3><p><strong>Category:</strong> Art &amp; Personal Effects &bull;
    <strong>Rarity:</strong> Rare</p><h3>Description</h3><p>An ominous fragment of memetic
    symbology, the bearer can issue one order to a visible target that understands their speech. The
    order must be something they would at least consider doing under the circumstances, and they can
    make a Mental save to resist. On failure, they obey the order for a scene. The stone crumbles
    after use.</p><h3>Power and Use</h3><p>Needs no energy cells, but can be used only once before
    being consumed or depleted. If not indicated otherwise, its effects last for one
    scene.</p><p>Unless specified otherwise, this device requires a Main Action to trigger its
    activation.</p>
